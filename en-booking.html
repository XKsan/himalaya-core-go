<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
Book City Return
</title>


<link rel="stylesheet" href="style.css">


</head>



<body>



<nav>


<a href="en.html">
HIMALAYA CORE GO
</a>


<a href="en-content.html">
BACK
</a>


</nav>




<main class="page booking">



<section>



<div class="small">
BOOKING
</div>



<h2>
Book City Return
</h2>




<form 
action="https://formspree.io/f/xaenvjqk"
method="POST"
>



<input 
type="hidden"
name="_next"
value="https://xksan.github.io/himalaya-core-go/success.html"
>



<label>
Name
</label>


<input
type="text"
name="name"
required
>




<label>
Phone
</label>


<input
type="tel"
name="phone"
required
>




<label>
Email (optional)
</label>


<input
type="email"
name="email"
>




<label>
Choose Route
</label>



<select name="route">



<option value="LAND">
LAND
</option>


<option value="WATER">
WATER
</option>


<option value="WIND">
WIND
</option>


<option value="FIRE">
FIRE
</option>


<option value="SPACE">
SPACE
</option>



</select>




<label>
Date
</label>



<input
type="date"
name="date"
>




<label>
Message
</label>


<textarea
name="message"
placeholder="Anything you would like to share">
</textarea>





<button>
SUBMIT
</button>



</form>



</section>





<section class="contact">


<h3>
WeChat Contact
</h3>


<img
src="assets/wechat-qrcode.png"
class="wechat"
>


<p>
We will contact you to confirm the experience.
</p>


</section>




</main>



</body>


</html>
